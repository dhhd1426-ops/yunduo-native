name: native
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compile Java to classes.dex (official SDK d8)
        run: bash ci/compile.sh 2>&1 | tee out-compile.log; test ${PIPESTATUS[0]} -eq 0
      - name: Native WE renderer libwe.so (NDK; x86_64 for the emulator, arm64-v8a for phones)
        run: |
          bash we/fetch.sh $HOME/wesrc > out/we-fetch.log 2>&1 || { tail -30 out/we-fetch.log; exit 1; }
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          for abi in x86_64 arm64-v8a; do
            cmake -S we -B build-$abi -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=29 -DANDROID_STL=c++_static \
              -DWSR_DIR=$HOME/wesrc/wsr -DLZ4_DIR=$HOME/wesrc/lz4 -DFREETYPE_DIR=$HOME/wesrc/freetype \
              > out/we-cmake-$abi.log 2>&1 || { tail -50 out/we-cmake-$abi.log; exit 1; }
            ninja -k 0 -C build-$abi we > out/we-build-$abi.log 2>&1 || { grep -E "error:" out/we-build-$abi.log | sort | uniq | head -60; exit 1; }
            mkdir -p out/lib/$abi
            $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip -o out/lib/$abi/libwe.so build-$abi/libwe.so
            ls -la out/lib/$abi/libwe.so
          done
          git fetch -q --depth 1 origin we-testdata && mkdir -p testdata && git --work-tree=testdata checkout FETCH_HEAD -- . && git reset -q || true
      - name: Build debuggable test APK (throwaway key)
        run: |
          python3 -m pip install --quiet pillow
          mv out-compile.log out/compile.log
          YD_BASE=$PWD/out/base-debug.apk YD_DEX=$PWD/out/classes.dex YD_LIBS=$PWD/out/lib python3 app/build.py out/test.apk 2>&1 | tee out/apk.log
          python3 app/verify.py out/test.apk 2>&1 | tee out/verify.log | tail -3
      - name: Hand the build to the emulator jobs
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            out/
            testdata/
            !out/check516/web
            !out/classes
            !out/gen
          retention-days: 3
      - name: Publish results to ci-out (build failed)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: bash ci/publish.sh
  emu:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emu-test.sh
      - name: Publish results to ci-out
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: bash ci/publish.sh
  guest:
    # 5.18 原生壁纸专项：-gpu guest 时 Vulkan 画的画面在截屏里看得到（-gpu swiftshader_indirect 下合成在宿主机 GPU 上，看不到客户机里 Vulkan 画的东西）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native wallpaper on a software-composited emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -camera-back none
          script: bash ci/emu-native.sh
      - name: Publish to ci-guest
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          P=/tmp/pubg; rm -rf $P; mkdir -p $P; cp -r out/guest/. $P/ 2>/dev/null || true
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_ID job=$JOB_STATUS at=$(date -u +%FT%TZ)" > $P/RESULT.txt
          cd $P && git init -q && git checkout -q -b ci-guest
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "guest $GITHUB_SHA"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-guest

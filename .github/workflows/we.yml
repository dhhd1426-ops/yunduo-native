name: we-native
# Wallpaper Engine 原生渲染移植（第一步：可行性）——NDK 交叉编译 + 模拟器里离屏渲染一帧
on:
  workflow_dispatch:   # 5.18 起原生库在 build.yml 里随 App 一起编、在模拟器里随 App 一起测；这个离屏验证只在手动触发时跑
permissions:
  contents: write
jobs:
  we:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream + deps, apply port patch
        run: bash we/fetch.sh $HOME/wesrc
      - name: Test wallpaper (branch we-testdata)
        run: |
          git fetch -q --depth 1 origin we-testdata
          mkdir -p testdata && git --work-tree=testdata checkout FETCH_HEAD -- .
          git reset -q
          ls -la testdata
      - name: NDK build (x86_64 for emulator, arm64-v8a for phones)
        run: |
          mkdir -p out/we
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          echo "ndk=$NDK" | tee out/we/toolchain.txt
          for abi in x86_64 arm64-v8a; do
            cmake -S we -B build-$abi -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=29 -DANDROID_STL=c++_static \
              -DWSR_DIR=$HOME/wesrc/wsr -DLZ4_DIR=$HOME/wesrc/lz4 -DFREETYPE_DIR=$HOME/wesrc/freetype \
              > out/we/cmake-$abi.log 2>&1 || { tail -50 out/we/cmake-$abi.log; exit 1; }
            ninja -k 0 -C build-$abi werender > out/we/build-$abi.log 2>&1 || { grep -E "error:" out/we/build-$abi.log | sort | uniq | head -60; exit 1; }
            cp build-$abi/werender build-$abi/werender.sym   # 留一份带符号的，崩溃时把 tombstone 地址翻成函数名
            $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip build-$abi/werender   # NDK 默认带 -g，不剥掉有上百 MB
            ls -la build-$abi/werender | tee -a out/we/toolchain.txt
          done
          cp build-arm64-v8a/werender out/we/werender-arm64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash we/ci/emu-run.sh
      - name: Symbolize crash (if any)
        if: always()
        run: |
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          f=out/we/logcat.txt; [ -f $f ] || exit 0
          grep -oE '#[0-9]+ pc [0-9a-f]+ +/data/local/tmp/we/werender' $f | awk '{print "0x"$3}' > /tmp/pcs || true
          [ -s /tmp/pcs ] && $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-addr2line -f -C -i -e build-x86_64/werender.sym $(cat /tmp/pcs) > out/we/crash-symbols.txt 2>&1 || true
          cat out/we/crash-symbols.txt 2>/dev/null | head -60
      - name: Publish to ci-we
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          P=/tmp/pub; rm -rf $P; mkdir -p $P; cp -r out/we/. $P/ 2>/dev/null || true
          python3 -m pip install --quiet pillow || true
          python3 -c "from PIL import Image; Image.open('$P/out.ppm').save('$P/out.png')" && rm -f $P/out.ppm || true
          find $P -size +50M -print -delete
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_ID job=$JOB_STATUS at=$(date -u +%FT%TZ)" > $P/RESULT.txt
          cd $P && git init -q && git checkout -q -b ci-we
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "WE CI $GITHUB_SHA"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-we

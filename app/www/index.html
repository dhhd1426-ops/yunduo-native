<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>云朵天气</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --deco-ink: #4a3f35;
    --bg: #dde6ef;
    --surface: #f5f8fb;
    --line: #c7d3df;
    --text: #1c2640;
    --muted: #525f78;
    --accent: #a0505d;
    --ink: #283a6e;
    --track: #d3dce7;
    --on-accent: #f5f8fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --deco-ink: #ddd4c2;
      color-scheme: dark;
      --bg: #11172a;
      --surface: #1a2239;
      --line: #2a3452;
      --text: #e8ecf4;
      --muted: #9aa5bf;
      --accent: #e3a6b0;
      --ink: #b9c8ef;
      --track: #2b3555;
      --on-accent: #1a2239;
    }
  }
  :root[data-theme="dark"] {
    --deco-ink: #ddd4c2;
    color-scheme: dark;
    --bg: #11172a;
    --surface: #1a2239;
    --line: #2a3452;
    --text: #e8ecf4;
    --muted: #9aa5bf;
    --accent: #e3a6b0;
    --ink: #b9c8ef;
    --track: #2b3555;
    --on-accent: #1a2239;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  [hidden] { display: none !important; }
  body { -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 20px 6px;
  }
  .brand {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .city-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 36px;
    padding: 0 14px;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font-size: 14px;
    white-space: nowrap;
    flex: none;
  }
  .city-pill:hover { border-color: var(--muted); }

  main { overflow-x: clip; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 8px 20px 28px;
  }
  :root { --spring: cubic-bezier(.16, 1, .3, 1); --soft: cubic-bezier(.2, .8, .2, 1); }
  .view { display: flex; flex-direction: column; gap: 16px; }
  .cols, .col-a, .col-b { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  @media (prefers-reduced-motion: no-preference) {
    /* 切换页面：内容按顺序轻轻浮现（只在切换时播放一次） */
    .anim-up .a { animation: inUp .7s var(--spring) both; animation-delay: calc(var(--i, 0) * 55ms); }
    .anim-fwd .a { animation: inFwd .5s var(--spring) both; animation-delay: calc(var(--i, 0) * 35ms); }
    .anim-back .a { animation: inBack .5s var(--spring) both; animation-delay: calc(var(--i, 0) * 35ms); }
    @keyframes inUp { from { opacity: 0; transform: translateY(16px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes inFwd { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
    @keyframes inBack { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }

    /* 按下反馈 */
    .btn, .chip, .qchip, .asst-bar, .city-main, .entry, .prov-card, .opt, .icon-btn, .city-pill, .round, .send-btn,
    .tabs button, .mp-row .pick, .hour, .day, .tool, .stat, .seg button, .switch {
      transition: transform .22s var(--soft), background-color .25s ease, color .25s ease, border-color .25s ease, opacity .25s ease;
    }
    .btn:active, .chip:active, .qchip:active, .asst-bar:active, .city-main:active, .entry:active, .prov-card:active, .opt:active,
    .icon-btn:active, .city-pill:active, .round:active, .send-btn:active, .tabs button:active, .mp-row .pick:active, .day:active,
    .tool:active, .seg button:active { transform: scale(.965); }
  }

  /* 问候 */
  .greeting { display: flex; flex-direction: column; gap: 0; }
  .greeting h1 {
    margin: 0;
    font-family: "Pinyon Script", "Dancing Script", cursive;
    font-weight: 400;
    font-size: clamp(30px, 8.5vw, 40px);
    line-height: 1.15;
    color: var(--ink);
    text-wrap: balance;
  }
  .greeting h1 .name { color: var(--accent); }
  .greeting h1 .name.cjk { font-family: "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", serif; font-size: .7em; font-weight: 600; letter-spacing: .06em; }
  .greeting .date, .advice-en {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 15px;
    line-height: 1.35;
    color: var(--muted);
  }
  .advice-en { color: var(--accent); }
  .flourish { color: var(--accent); margin-top: 4px; }

  /* 问候语书写动画 */
  .script { display: block; height: auto; max-width: 100%; overflow: visible; }
  .script .gl { fill: currentColor; stroke: currentColor; stroke-width: .8px; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
  .script .pending { fill-opacity: 0; stroke-opacity: 0; }
  .script .nib { fill: var(--accent); opacity: 0; }
  .script .ink { color: var(--ink); }
  .script .acc { color: var(--accent); }
  .greeting h1 { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .25em; }
  /* ---------- 开屏：信封 → 玫瑰 → 信 → 主页 ---------- */
  #splash { position: fixed; inset: 0; z-index: 200; background: #141a2d; display: none; overflow: hidden; cursor: pointer;
    -webkit-tap-highlight-color: transparent; }
  html.splashing #splash { display: block; }
  html.splashing .app { opacity: 0; }
  #splash::before { content: ""; position: absolute; inset: -20%; background: radial-gradient(60% 45% at 50% 48%, rgba(231, 214, 188, .09), transparent 70%); }
  .sp-stage { position: absolute; left: 50%; top: 50%; width: 360px; height: 680px; transform-origin: 50% 50%; }
  .sp-env { position: absolute; left: 30px; top: 300px; width: 300px; height: 196px; border-radius: 10px; }
  .sp-back { background: linear-gradient(180deg, #d9cbac, #e4d8bd); z-index: 1; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .55), 0 10px 20px -10px rgba(0, 0, 0, .4); }
  .sp-win { position: absolute; left: 0; top: -700px; width: 360px; height: 1196px; overflow: hidden; z-index: 2; pointer-events: none; }
  .sp-front { z-index: 3; background: linear-gradient(180deg, #efe5cf, #f4ecda); clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%); }
  .sp-front svg { position: absolute; inset: 0; }
  .sp-flap { position: absolute; left: 30px; top: 300px; width: 300px; height: 118px; z-index: 5; background: linear-gradient(180deg, #f5edd9, #eadfc4);
    clip-path: polygon(0 0, 100% 0, 52% 98%, 50% 100%, 48% 98%); transform-origin: 50% 0; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .12)); }
  .sp-seal { position: absolute; left: 155px; top: 389px; width: 50px; height: 50px; z-index: 6; }
  .sp-seal .h { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #c25563, #9c3a47 60%, #7d2b36);
    box-shadow: inset 0 0 0 3px rgba(125, 43, 54, .55), 0 2px 5px rgba(0, 0, 0, .35); }
  .sp-seal .h.l { clip-path: polygon(0 0, 54% 0, 44% 30%, 56% 55%, 46% 100%, 0 100%); }
  .sp-seal .h.r { clip-path: polygon(54% 0, 100% 0, 100% 100%, 46% 100%, 56% 55%, 44% 30%); }
  .sp-seal svg { position: absolute; left: 9px; top: 9px; width: 32px; height: 32px; }
  .sp-letter { position: absolute; left: 30px; top: 820px; width: 300px; height: 440px; border-radius: 12px; transform-origin: 50% 50%;
    background: linear-gradient(180deg, #fcf8ee, #f7f0e0); color: #3b3226;
    box-shadow: inset 0 0 0 1px rgba(59, 50, 38, .08), inset 0 0 0 7px #fcf8ee, inset 0 0 0 8px rgba(156, 74, 85, .25), 0 24px 60px -18px rgba(0, 0, 0, .6); }
  .sp-rose { position: absolute; left: 55px; top: 70px; width: 190px; height: 255px; transform-origin: 50% 50%; visibility: hidden; }
  .sp-rose svg { width: 100%; height: 100%; overflow: visible; }
  .sp-text { position: absolute; left: 0; right: 0; top: 150px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .sp-text .script { margin: 0 auto; }
  .sp-letter .script .ink { color: #3b3226; }
  .sp-letter .script .acc { color: #9c4a55; }
  .sp-rule { width: 120px; height: 12px; margin: 14px auto 12px; opacity: 0; }
  .sp-zh { margin: 0; font-family: "Amor Serif SC", "Noto Serif CJK SC", serif; font-weight: 300; font-size: 15px; letter-spacing: .32em; color: #3b3226; opacity: 0; }
  .sp-date { margin: 8px 0 0; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 14px; color: #6f6452; opacity: 0; }
  .sp-sign { position: absolute; right: 26px; bottom: 26px; width: 130px; }
  .sp-sign .script { margin-left: auto; }
  .sp-paper { position: fixed; inset: 0; z-index: 3; visibility: hidden; clip-path: inset(0 round 0);
    background: radial-gradient(120% 90% at 50% 45%, #fdfaf2 0%, #f8f1e2 62%, #efe4cd 100%); color: #3b3226; }
  .sp-paper::before { content: ""; position: absolute; inset: 12px; border: 1px solid rgba(156, 74, 85, .22); border-radius: 10px; pointer-events: none; }
  .sp-paper::after { content: ""; position: absolute; inset: 17px; border: 1px solid rgba(156, 74, 85, .12); border-radius: 7px; pointer-events: none; }
  .sp-col { position: absolute; left: 50%; top: 50%; width: 300px; height: 440px; transform-origin: 50% 50%; }
  .sp-paper .sp-sign { right: 18px; bottom: 30px; width: 160px; }
  .sp-paper .script .ink { color: #3b3226; }
  .sp-paper .script .acc { color: #9c4a55; }
  .sp-flock { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 8; overflow: visible; pointer-events: none; }
  .sp-flock .wings { transform-box: view-box; transform-origin: 0 0; }
  .sp-skip { position: absolute; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 12px; letter-spacing: .2em;
    color: rgba(221, 212, 194, .45); opacity: 0; animation: spSkip .8s ease 1.4s forwards; }
  @keyframes spSkip { to { opacity: 1; } }

  /* 两行问候：Good Afternoon, / Dear Yang Zhiwei */
  .greeting { position: relative; }
  .greeting h1 { position: relative; z-index: 1; }
  .greeting h1.two { display: block; }
  .greeting h1.two .script + .script { margin: -.34em 0 0 .62em; }
  .greeting .date, .greeting .advice-en, .greeting .flourish { position: relative; z-index: 1; }
  .zh-name { font-family: "Amor Serif SC", "Noto Serif CJK SC", serif; font-style: normal; font-weight: 300; font-size: 13px; letter-spacing: .3em; color: var(--ink); margin-right: .1em; }
  /* 蝶环：玫瑰、小草、蝴蝶，原创博物图谱风线描 */
  .deco { position: absolute; left: 174px; bottom: -40px; width: 196px; height: 228px; z-index: 0; pointer-events: none; overflow: visible; }
  .deco > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  /* 小狐狸：你画的 20 帧（走路 12 + 趴下 8），拼成逐帧动画；趴好以后拆成头和身体两层 */
  .fox { position: absolute; left: 0; bottom: 9.36px; width: 110px; height: 73.1px; opacity: 0; will-change: transform;
    filter: saturate(.84) sepia(.06) contrast(.95); pointer-events: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fox { filter: saturate(.78) sepia(.1) contrast(.93) brightness(.94); } }
  :root[data-theme="dark"] .fox { filter: saturate(.78) sepia(.1) contrast(.93) brightness(.94); }
  .fox .fw { position: absolute; inset: 0; background: url("fonts/fox-walk.webp") 0 0 / 800% 500% no-repeat; }
  .fox .fl { position: absolute; inset: 0; visibility: hidden; transform-origin: 50% 100%; }
  .fox.lying .fw { visibility: hidden; }
  .fox.lying .fl { visibility: visible; }
  .fox .fl img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fox .fx-head { position: absolute; inset: 0; transform-origin: 61.18% 55.87%; }
  .fox .fx-lid { position: absolute; left: 66.46%; top: 47.14%; width: 3.29%; height: 3.81%;
    transform: translate(-50%, -50%) scaleY(0); transform-origin: 50% 0; border-radius: 50% 50% 45% 45%; background: rgb(198,151,99); }
  .fox .fx-shadow { position: absolute; left: 14%; right: 18%; bottom: 4.35%; height: 6px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0, 0, 0, .3), transparent); }
  .fox.still .fl { animation: foxBreath 4.4s ease-in-out infinite; }
  @keyframes foxBreath { 50% { transform: scale(1.004, 1.016); } }
  @media (prefers-reduced-motion: reduce) { .fox.still .fl { animation: none; } }
  .deco [stroke="#010101"] { stroke: var(--deco-ink); }
  .deco [fill="#010101"] { fill: var(--deco-ink); }
  .deco .wings, .deco .sway { transform-box: view-box; transform-origin: 0 0; }
  @media (max-width: 380px) { .deco { left: auto; right: -12px; transform: scale(.86); transform-origin: 100% 100%; } .greeting h1.two .script { max-width: 80%; } }
  .cjk-name { font-family: "Amor Serif SC", "Noto Serif CJK SC", serif; font-size: .7em; font-weight: 600; letter-spacing: .06em; color: var(--accent); }
  @media (prefers-reduced-motion: no-preference) {
    .greeting.gw .date, .greeting.gw .advice-en { opacity: 0; transform: translateY(6px); filter: blur(3px); transition: opacity .8s var(--spring), transform .8s var(--spring), filter .8s ease; }
    .greeting.gw .advice-en { transition-delay: .12s; }
    .greeting.gw.lines .date, .greeting.gw.lines .advice-en { opacity: 1; transform: none; filter: none; }
    .greeting.gw .flourish { opacity: 0; }
    .greeting.gw.lines .flourish { opacity: 1; }
    .flourish.drawing .fl-dot { opacity: 0; }
    .flourish .fl-nib { fill: var(--accent); }
    .cjk-name.brush { animation: brush 1s var(--soft) both; animation-delay: var(--bd, 0ms); }
    @keyframes brush { from { clip-path: inset(0 100% 0 0); filter: blur(3px); opacity: .3; } to { clip-path: inset(0 0 0 0); filter: none; opacity: 1; } }
  }

  /* 温度数字滚动 */
  .odo { display: inline-flex; align-items: flex-start; }
  .odo .col { display: inline-block; height: 1em; overflow: hidden; }
  .odo .strip { display: flex; flex-direction: column; transition: transform 1.3s var(--spring); will-change: transform; }
  .odo .strip span { display: block; height: 1em; line-height: 1; text-align: center; }
  .odo .sym { line-height: 1; }

  /* 天气卡片入场 */
  @media (prefers-reduced-motion: no-preference) {
    .hero.enter { animation: heroIn 1s var(--spring) both .12s; }
    .hero.enter .place, .hero.enter .cond, .hero.enter .range, .hero.enter .label { animation: inUp .8s var(--spring) both; }
    .hero.enter .place { animation-delay: .35s; }
    .hero.enter .cond { animation-delay: .7s; }
    .hero.enter .range, .hero.enter .label { animation-delay: .82s; }
    .hero.enter .big-ic svg * { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s var(--soft) forwards .55s; }
    @keyframes heroIn { from { opacity: 0; transform: translateY(20px) scale(.975); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .big-ic { animation: floaty 6s ease-in-out infinite; }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .hero canvas { transition: opacity 1.6s ease .4s; }
    .hero.enter canvas { opacity: 0; }
    .hero.enter.fx-on canvas { opacity: 1; }
  }

  /* 当前 */
  .now {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 12px;
  }
  .now .place-en {
    font-family: "Pinyon Script", "Dancing Script", cursive;
    font-size: 28px;
    color: var(--accent);
    line-height: 1;
  }
  .now .place { font-size: 18px; font-weight: 500; }
  .temp {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 300;
    font-size: clamp(72px, 21vw, 108px);
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .now .cond { font-size: 18px; font-weight: 500; }
  .now .range { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .now .big-ic { color: var(--accent); padding-bottom: 12px; }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat {
    background: var(--surface);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .k em, .panel h2 em {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-weight: 400;
    color: var(--accent);
  }
  .stat .k em { font-size: 13px; margin-left: 4px; }
  .stat .v { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }

  .panel {
    background: var(--surface);
    border-radius: 20px;
    padding: 14px 18px 10px;
  }
  .panel h2 {
    margin: 0 0 6px;
    font-size: 13px; font-weight: 500;
    color: var(--muted);
    display: flex; align-items: baseline; gap: 8px;
  }
  .panel h2 em { font-size: 15px; }

  /* 逐小时 */
  .hours {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 56px;
    gap: 4px;
    overflow-x: auto;
    padding-bottom: 6px;
    scrollbar-width: thin;
  }
  .hour {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 0;
    border: 1px solid transparent;
    border-radius: 14px;
    background: transparent;
    font-variant-numeric: tabular-nums;
  }
  .hour:hover { border-color: var(--line); }
  .hour[aria-pressed="true"] { background: var(--bg); border-color: var(--line); }
  .hour .t { font-size: 12px; color: var(--muted); }
  .hour svg { color: var(--accent); }
  .hour .d { font-weight: 500; }
  .hour-detail {
    border-top: 1px solid var(--line);
    padding: 10px 0 4px;
    font-size: 14px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .hour-detail b { color: var(--text); font-weight: 500; }

  /* 建议 */
  .tip {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) auto;
    gap: 12px;
    align-items: start;
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }
  .tip:first-of-type { border-top: 0; }
  .tip .ic {
    width: 36px; height: 36px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink);
  }
  .tip .body { display: flex; flex-direction: column; gap: 2px; }
  .tip .ttl { font-weight: 500; display: flex; align-items: baseline; gap: 8px; }
  .tip .ttl em { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 400; font-size: 14px; color: var(--muted); }
  .tip .txt { color: var(--muted); font-size: 14px; }
  .tag {
    font-size: 12px; font-weight: 500; white-space: nowrap;
    padding: 3px 10px; border-radius: 12px; margin-top: 6px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .tag.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  /* 预报 */
  .view-title {
    margin: 0;
    font-family: "Pinyon Script", "Dancing Script", cursive;
    font-weight: 400;
    font-size: 44px;
    line-height: 1.2;
    color: var(--ink);
  }
  .view-sub { margin: -14px 0 0; color: var(--muted); font-size: 14px; }
  .day {
    width: 100%;
    display: grid;
    grid-template-columns: 44px 26px minmax(0, 1fr) 34px minmax(50px, 96px) 34px;
    align-items: center;
    gap: 8px;
    min-height: 54px;
    padding: 0;
    border: 0;
    border-top: 1px solid var(--line);
    background: transparent;
    text-align: left;
    font-variant-numeric: tabular-nums;
  }
  .day-wrap:first-of-type .day { border-top: 0; }
  .day .n { font-weight: 500; }
  .day svg { color: var(--accent); }
  .day .c { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day .lo { color: var(--muted); text-align: right; }
  .day .hi { font-weight: 500; }
  .bar { position: relative; height: 4px; border-radius: 2px; background: var(--track); }
  .bar i { position: absolute; top: 0; height: 4px; border-radius: 2px; background: var(--accent); }
  .day-more {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    padding: 4px 0 14px;
  }
  .day-more div { background: var(--bg); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; }
  .day-more .k { font-size: 12px; color: var(--muted); }
  .day-more .v { font-weight: 500; font-variant-numeric: tabular-nums; }
  .day-more p { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--muted); }

  /* 城市 */
  .city-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 44px;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--line);
  }
  .city-row:first-of-type { border-top: 0; }
  .city-main {
    display: flex; align-items: center; gap: 12px;
    min-height: 64px;
    padding: 0;
    border: 0; background: transparent; text-align: left;
  }
  .city-main svg { color: var(--accent); flex: none; }
  .city-main .nm { display: flex; flex-direction: column; line-height: 1.3; }
  .city-main .nm b { font-weight: 500; }
  .city-main .nm span { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; color: var(--muted); }
  .city-row .tt { font-family: "Cormorant Garamond", Georgia, serif; font-size: 30px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .city-row.active .nm b::after { content: "当前"; margin-left: 8px; font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--accent); color: var(--on-accent); vertical-align: 2px; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 22px;
    border: 0; background: transparent; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--bg); color: var(--text); }
  .icon-btn:disabled { opacity: .3; cursor: not-allowed; }

  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0 14px;
    color: var(--muted);
  }
  .search input { flex: 1; min-width: 0; border: 0; background: transparent; height: 46px; outline: none; color: var(--text); }
  .search:focus-within { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 40px; padding: 0 14px;
    border-radius: 20px; border: 1px dashed var(--line);
    background: transparent; color: var(--text);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { border-style: solid; border-color: var(--accent); }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }

  /* 设置 */
  .field { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
  .field:first-of-type { border-top: 0; }
  .field label, .field .lbl { font-weight: 500; }
  .field .hint { font-size: 13px; color: var(--muted); margin: 0; }
  .field input[type="text"] {
    height: 44px; padding: 0 12px;
    border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg);
  }
  .field input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--bg); border-radius: 12px; padding: 3px; }
  .seg button { min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .note { font-size: 12px; color: var(--muted); margin: 0; }
  .sign { font-family: "Pinyon Script", "Dancing Script", cursive; font-size: 24px; color: var(--ink); }

  /* 底部标签栏 */
  .tabs {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    border-top: 1px solid var(--line);
    background: var(--surface);
    padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .tabs button {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-height: 52px;
    border: 0; background: transparent;
    color: var(--muted);
    font-size: 12px;
    border-radius: 12px;
  }
  .tabs button[aria-current="page"] { color: var(--accent); font-weight: 500; }
  .tabs button:hover { color: var(--text); }
  .tabs { position: relative; }
  .tabs button { position: relative; z-index: 1; }
  .tab-ind { position: absolute; z-index: 0; top: 6px; left: 12px; height: 52px; width: calc((100% - 24px) / 4); border-radius: 14px;
    background: var(--bg); transform: translateX(calc(var(--ti, 0) * 100%)); transition: transform .5s var(--spring); pointer-events: none; }
  @media (prefers-reduced-motion: no-preference) {
    .tabs button.tpop svg { animation: tabPop .5s var(--spring); }
    @keyframes tabPop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: none; } }
  }

  /* ---------- 屏幕适配 ---------- */
  /* 窄屏：折叠屏外屏、小屏手机 */
  @media (max-width: 380px) {
    main { padding: 6px 14px 24px; }
    .top { padding: 12px 14px 4px; }
    .stats { gap: 6px; }
    .stat { padding: 10px 11px; }
    .stat .k em { display: none; }
    .hero { padding: 16px 16px 14px; }
    .panel { padding: 12px 14px 8px; }
    .qchip { padding: 0 10px; }
  }
  /* 展开的折叠屏、阔折叠、横屏：左侧导航 + 两栏 */
  @media (min-width: 720px) {
    .app { max-width: none; display: grid; grid-template-columns: 92px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .top { grid-column: 2; grid-row: 1; padding: 18px 32px 8px; width: 100%; max-width: 1240px; margin: 0 auto; }
    main { grid-column: 2; grid-row: 2; padding: 8px 32px 36px; }
    .tabs { grid-column: 1; grid-row: 1 / 3; grid-template-columns: 1fr; grid-auto-rows: 68px; align-content: center; gap: 6px;
      border-top: 0; border-right: 1px solid var(--line); padding: 16px 12px; }
    .tabs button { min-height: 68px; }
    .tab-ind { top: auto; left: 12px; right: 12px; width: auto; height: 68px;
      transform: translateY(calc(var(--ti, 0) * (100% + 6px))); top: calc(50% - 2 * 68px - 1.5 * 6px); }
    .view { max-width: 760px; margin: 0 auto; width: 100%; }
    .view.today { max-width: 1240px; }
    .cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: start; }
    .hero { padding: 24px 28px 22px; min-height: 280px; display: flex; flex-direction: column; justify-content: flex-end; }
    .temp { font-size: clamp(96px, 10vw, 150px); }
    .now .big-ic svg { width: 88px; height: 88px; }
    .toast { left: calc(50% + 46px); }
    .greeting .date, .advice-en { font-size: 17px; }
  }
  @media (min-width: 1100px) {
    .cols { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; }
  }

  /* 助理入口 */
  .asst { background: var(--surface); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .asst-bar { height: 48px; border-radius: 24px; border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px; font-size: 15px; text-align: left; width: 100%; }
  .asst-bar .spark { color: var(--ink); flex: none; }
  .asst-bar .ph { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .asst-bar .go { width: 36px; height: 36px; border-radius: 18px; background: var(--ink); color: var(--surface);
    display: flex; align-items: center; justify-content: center; flex: none; }
  .qchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .qchips::-webkit-scrollbar { display: none; }
  .qchip { height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: transparent;
    color: var(--text); font-size: 13px; white-space: nowrap; flex: none; }
  .qchip:disabled { opacity: .5; }

  /* 全屏助理：先拉出抽屉，再展开到全屏 */
  .sheet-wrap { position: fixed; inset: 0; z-index: 20; }
  .sheet-backdrop { position: absolute; inset: 0; border: 0; padding: 0; width: 100%; background: rgba(17, 23, 42, .42); }
  .sheet { position: absolute; inset: 0; background: var(--surface); display: flex; overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom, 0px); }
  @media (prefers-reduced-motion: no-preference) {
    .sheet-wrap.enter .sheet { animation: sheetOpen .52s cubic-bezier(.22, .9, .24, 1) both; }
    .sheet-wrap.enter .sheet-backdrop { animation: fadeIn .3s ease both; }
    .sheet-wrap.enter .chat-main > * { animation: riseIn .4s .22s ease both; }
    .sheet-wrap.leave .sheet { animation: sheetClose .3s cubic-bezier(.4, 0, .7, .2) both; }
    .sheet-wrap.leave .sheet-backdrop { animation: fadeIn .3s ease reverse both; }
    @keyframes sheetOpen {
      0%   { transform: translateY(100%); border-radius: 28px 28px 0 0; }
      55%  { transform: translateY(16%);  border-radius: 28px 28px 0 0; }
      100% { transform: translateY(0);    border-radius: 0; }
    }
    @keyframes sheetClose {
      from { transform: translateY(0); border-radius: 0; }
      to   { transform: translateY(100%); border-radius: 28px 28px 0 0; }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  }

  /* 右侧：对话 */
  .chat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .chat-top { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 8px 8px 6px; touch-action: none; }
  .chat-top .ttl { text-align: center; min-width: 0; display: flex; flex-direction: column; }
  .chat-top .ttl b { font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-top .ttl span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-top .acts { display: flex; }
  .chat-col { width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; min-height: 0; }
  .ctx { margin: 0 20px; padding: 8px 12px; border-radius: 12px; background: var(--bg); font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; }
  .ctx svg { color: var(--accent); flex: none; }
  .msgs { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .msgs .chat-col { padding: 14px 20px; gap: 12px; }
  .msg { max-width: 86%; padding: 10px 14px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.me { align-self: flex-end; background: var(--ink); color: var(--surface); border-radius: 18px 18px 4px 18px; max-width: 78%; }
  .msg.bot { align-self: flex-start; background: var(--bg); border-radius: 18px 18px 18px 4px; }
  .msg-note { align-self: flex-start; font-size: 12px; color: var(--muted); margin-top: -6px; }
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 14px 16px; background: var(--bg); border-radius: 18px 18px 18px 4px; }
  .typing i { width: 6px; height: 6px; border-radius: 3px; background: var(--muted); opacity: .4; }
  @media (prefers-reduced-motion: no-preference) {
    .typing i { animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .2s; }
    .typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }
    .msg.new { animation: riseIn .25s ease both; }
  }
  .welcome { padding-top: 12vh; display: flex; flex-direction: column; gap: 6px; }
  .welcome .hi { font-family: "Pinyon Script", "Dancing Script", cursive; font-size: 40px; line-height: 1.15; color: var(--ink); }
  .welcome .hi .cjk { font-family: "Noto Serif SC", "Noto Serif CJK SC", serif; font-size: .66em; font-weight: 600; color: var(--accent); }
  .welcome p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
  .welcome .btn { align-self: flex-start; margin-top: 10px; }
  .sheet-foot { border-top: 1px solid var(--line); }
  .sheet-foot .chat-col { padding: 10px 20px 14px; gap: 10px; }
  .send-row { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 8px; align-items: center; }
  .send-row input { height: 46px; border-radius: 23px; border: 1px solid var(--line); background: var(--bg); padding: 0 16px;
    font: inherit; font-size: 15px; color: var(--text); min-width: 0; }
  .send-row input:focus { outline: none; border-color: var(--accent); }
  .send-btn { width: 46px; height: 46px; border-radius: 23px; border: 0; background: var(--ink); color: var(--surface);
    display: flex; align-items: center; justify-content: center; }
  .send-btn:disabled { opacity: .5; }
  .err-line { align-self: stretch; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--accent); }
  .err-line button { border: 0; background: transparent; color: var(--ink); text-decoration: underline; font-size: 13px; padding: 6px; }

  /* 左侧：聊天记录抽屉 */
  .side { width: 300px; max-width: 84%; background: var(--bg); display: flex; flex-direction: column; min-height: 0; flex: none;
    border-right: 1px solid var(--line); }
  .side-scrim { display: none; }
  @media (max-width: 759px) {
    .side { position: absolute; top: 0; bottom: 0; left: 0; z-index: 3; transform: translateX(-102%);
      box-shadow: 8px 0 24px rgba(17, 23, 42, .18); transition: transform .28s cubic-bezier(.22, .9, .24, 1); }
    .side-scrim { display: block; position: absolute; inset: 0; z-index: 2; border: 0; padding: 0; width: 100%;
      background: rgba(17, 23, 42, .36); opacity: 0; pointer-events: none; transition: opacity .28s ease; }
    .sheet.side-open .side { transform: none; }
    .sheet.side-open .side-scrim { opacity: 1; pointer-events: auto; }
  }
  @media (min-width: 760px) { .chat-top .menu { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .side, .side-scrim { transition: none; } }
  .side-head { display: flex; align-items: center; gap: 12px; padding: 18px 16px 10px; }
  .avatar { width: 48px; height: 48px; border-radius: 24px; background: var(--accent); color: var(--on-accent);
    display: flex; align-items: center; justify-content: center; font-family: "Noto Serif SC", "Cormorant Garamond", serif;
    font-size: 20px; font-weight: 600; flex: none; }
  .side-head .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .side-head .who b { font-weight: 500; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-head .who span { font-size: 13px; color: var(--muted); }
  .side-row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 0; background: transparent;
    color: var(--text); font-size: 15px; width: 100%; text-align: left; }
  .side-row svg { color: var(--muted); flex: none; }
  .side-search { margin: 4px 12px 6px; }
  .side-search .search { background: var(--surface); }
  .side-tabs { display: flex; gap: 6px; padding: 6px 12px 4px; }
  .side-tabs button { height: 34px; padding: 0 14px; border-radius: 17px; border: 0; background: transparent; color: var(--muted); font-size: 14px; }
  .side-tabs button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 500; }
  .side-list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; overscroll-behavior: contain; }
  .side-group { font-size: 12px; color: var(--accent); padding: 12px 8px 4px; letter-spacing: .04em; }
  .conv { display: grid; grid-template-columns: minmax(0, 1fr) 36px; align-items: center; border-radius: 12px; }
  .conv.on { background: var(--surface); }
  .conv .open { border: 0; background: transparent; text-align: left; padding: 9px 8px; min-height: 48px; color: var(--text); min-width: 0; }
  .conv .open b { display: block; font-weight: 400; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .open span { display: block; font-size: 12px; color: var(--muted); }
  .conv .pin { width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; border-radius: 18px; }
  .conv .pin[aria-pressed="true"] { color: var(--accent); }
  .side-empty { color: var(--muted); font-size: 14px; padding: 16px 8px; margin: 0; }
  .side-foot { display: flex; gap: 10px; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
  .round { width: 46px; height: 46px; border-radius: 23px; border: 0; background: var(--ink); color: var(--surface);
    display: flex; align-items: center; justify-content: center; }
  .round.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); margin-left: auto; }
  .toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px) scale(.94); opacity: 0; z-index: 30; pointer-events: none;
    transition: opacity .28s ease, transform .5s var(--spring);
    background: var(--text); color: var(--bg);
    padding: 8px 16px; border-radius: 20px; font-size: 14px;
    max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  @media (min-width: 720px) { .toast { bottom: 36px; } }

  /* 实况数据相关 */
  .alert {
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr);
    gap: 10px;
    align-items: start;
    padding: 8px 12px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 13px;
    line-height: 1.4;
  }
  .alert ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .dn { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 4px 0 8px; }
  .dn > div { display: flex; align-items: center; gap: 10px; }
  .dn svg { color: var(--accent); flex: none; }
  .dn .k { font-size: 12px; color: var(--muted); }
  .dn .v { font-weight: 500; }
  .dn .s { font-size: 13px; color: var(--muted); }
  .meta-line { border-top: 1px solid var(--line); padding: 10px 0 4px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .src { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .state { padding: 48px 0; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .state .sign { font-size: 34px; }
  .group-label { font-size: 12px; color: var(--muted); letter-spacing: .04em; margin: 8px 0 4px; }
  .now .label { font-size: 13px; color: var(--muted); }

  /* 天气特效：只在当前天气卡片里 */
  .hero {
    position: relative;
    overflow: hidden;
    border-radius: 24px;
    background: var(--surface);
    padding: 18px 20px 16px;
    isolation: isolate;
  }
  .hero canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .hero .now { position: relative; z-index: 1; }
  .top-actions { display: flex; align-items: center; gap: 4px; }
  .spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .txt-in {
    height: 44px; padding: 0 12px; min-width: 0; width: 100%;
    border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font: inherit; font-size: 15px;
  }
  .txt-in:focus { outline: none; border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .btn {
    min-height: 44px; padding: 0 16px; border-radius: 22px;
    border: 1px solid var(--line); background: transparent; color: var(--text);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .btn:disabled { opacity: .55; cursor: default; }
  .ds-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .ds-status { font-size: 13px; margin: 0; line-height: 1.5; word-break: break-all; }
  .ds-status.ok { color: var(--ink); }
  .ds-status.err { color: var(--accent); }
  .ai-out { white-space: pre-wrap; font-size: 15px; line-height: 1.65; padding: 4px 0 10px; }
  .ai-meta { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .sub-head { display: flex; align-items: center; gap: 10px; }
  .sub-head h1 { margin: 0; font-size: 22px; font-weight: 500; flex: 1; }
  .ds-logo { width: 36px; height: 36px; border-radius: 18px; background: var(--ink); color: var(--surface);

        opt('bocha', '博查搜索', SEARCHERS.bocha.note, 'globe') +
        opt('tavily', 'Tavily', SEARCHERS.tavily.note, 'globe');
      if (cur !== 'off') {
        inner += '<div class="field"><label for="s-key">' + SEARCHERS[cur].name + ' API Key</label>' +
          '<input id="s-key" class="txt-in" type="password" value="' + esc(srch.keys[cur] || '') + '" autocomplete="off" spellcheck="false" placeholder="' + (cur === 'tavily' ? 'tvly-…' : 'sk-…') + '"></div>' +
          '<div class="field"><span class="lbl">每次搜索的网页数</span>' +
            '<div class="seg" role="group">' + [3, 5, 8].map(function (n) { return '<button type="button" data-scount="' + n + '" aria-pressed="' + (srch.count === n) + '">' + n + ' 个</button>'; }).join('') + '</div></div>' +
          '<div class="ds-actions"><button type="button" class="btn" data-stest="1">' + icon('plug', 18) + '测试搜索</button></div>' +
          (chat.stest ? '<p class="ds-status ' + chat.stest.type + '">' + esc(chat.stest.text) + '</p>' : '');
      }
      return popShell('联网搜索', X_BTN(), '工具', inner);
    }
    if (chat.pop === 'proc') return popShell('思考过程', X_BTN(), '思考过程', procItems(procData()));
    return '';
  }

  // 手势：顶部下拉收起；左边缘右滑拉出聊天记录；记录抽屉左滑收起
  function bindGestures() {
    var sheet = document.getElementById('sheet'), top = document.getElementById('chat-top'), side = document.getElementById('side');
    if (!sheet) return;
    if (top) {
      var y0 = null, dy = 0;
      top.addEventListener('touchstart', function (e) { if (e.target.closest('button')) return; y0 = e.touches[0].clientY; dy = 0; sheet.style.transition = 'none'; }, { passive: true });
      top.addEventListener('touchmove', function (e) { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = 'translateY(' + dy + 'px)'; sheet.style.borderRadius = Math.min(28, dy / 4) + 'px ' + Math.min(28, dy / 4) + 'px 0 0'; }, { passive: true });
      top.addEventListener('touchend', function () {
        if (y0 == null) return; y0 = null;
        sheet.style.transition = 'transform .22s ease, border-radius .22s ease';
        if (dy > 120) { sheet.style.transform = 'translateY(100%)'; setTimeout(function () { chat.open = false; $sheet.innerHTML = ''; }, 220); }
        else { sheet.style.transform = ''; sheet.style.borderRadius = ''; }
      });
    }
    var x0 = null, fromEdge = false;
    sheet.addEventListener('touchstart', function (e) {
      var x = e.touches[0].clientX;
      fromEdge = !chat.side && x < 28;
      x0 = (fromEdge || (chat.side && side && side.contains(e.target))) ? x : null;
    }, { passive: true });
    sheet.addEventListener('touchend', function (e) {
      if (x0 == null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (fromEdge && dx > 60) setSide(true);
      else if (!fromEdge && dx < -60) setSide(false);
    });
  }

  function sendChat(text) {
    text = (text || '').trim();
    var rm = resolveModel();
    if (!text || chat.busy || !rm) return;
    var conv = curConv();
    if (!conv) {
      conv = { id: Date.now().toString(36), title: text.length > 16 ? text.slice(0, 16) + '…' : text, city: chat.city || state.current,
               created: Date.now(), updated: Date.now(), pinned: false, msgs: [], model: '', pname: '' };
      chats.unshift(conv); chat.cur = conv.id;
    }
    conv.msgs.push({ role: 'user', content: text, ts: Date.now() });
    var memText = memPrompt(conv), useRecall = mem.on && mem.recall && chats.some(function (c) { return c.id !== conv.id && c.msgs.length; });
    // 模型不支持工具时的兜底：只有你提到以前的事，才由 App 帮她翻
    var rclFb = useRecall && RECALL_ASK.test(text) ? recallPrompt(conv, text) : { text: '', hits: [] };
    memTouch(Date.now());
    conv.updated = Date.now(); saveChats();
    chat.lastQ = text; chat.draft = ''; chat.err = ''; chat.busy = true; chat.fresh = 1; chat.partial = ''; chat.partialThink = '';
    chat.stopped = false; chat.thinkMs = 0; chat.xhr = null; chat.procLine = '';
    typerReset();
    chat.sources = null; chat.phase = srch.provider !== 'off' ? 'search' : ''; chat.pop = ''; chat.recall = null;
    renderSheet();

    var name = state.name.trim();
    var system = (asst.prompt || DEFAULT_PROMPT).replace(/\{name\}/g, name || '用户');
    var v = view(conv.city);
    system += '\n\n现在是北京时间 ' + bjDate(0) + ' ' + new Date(Date.now() + 8 * 3600e3).toISOString().slice(11, 16) + '。';
    system += memText;
    var systemNoTools = null;
    if (useRecall) { systemNoTools = system + rclFb.text; system += recallRule(); }
    if (asst.weather && v) system += '\n下面是' + v.m.zh + '的中国气象局天气数据，聊到天气、穿衣、出行时参考，不要编造数据里没有的数字：\n' + weatherContext(v);

    var hist = conv.msgs.slice();
    if (asst.ctx > 0) hist = hist.slice(-asst.ctx);
    while (hist.length && hist[0].role !== 'user') hist.shift();
    hist = hist.map(function (x) { return { role: x.role, content: x.content }; });

    var liveRead = null;
    var searching = srch.provider !== 'off'
      ? webSearch(text).then(function (list) { return list; }, function (e) { toast('联网搜索失败：' + e.msg); return []; })
      : Promise.resolve(null);
    var stopP = new Promise(function (_, rej) { chat.stopRej = rej; });
    searching = Promise.race([searching, stopP]);

    searching.then(function (results) {
      if (chat.stopped) throw { stopped: true, msg: '已停止' };
      chat.phase = '';
      chat.sources = results && results.length ? results : null;
      if (chat.sources) {
        system += '\n\n下面是刚才联网搜索“' + text + '”得到的网页内容，回答时参考，涉及事实要以这些内容为准，可以提到来源网站：\n' +
          chat.sources.map(function (r, i) { return (i + 1) + '. ' + r.title + '（' + r.site + '）\n' + r.text; }).join('\n\n');
      }
      if (systemNoTools && v && asst.weather) systemNoTools += '\n下面是' + v.m.zh + '的中国气象局天气数据，聊到天气、穿衣、出行时参考，不要编造数据里没有的数字：\n' + weatherContext(v);
      if (systemNoTools && chat.sources) systemNoTools += system.slice(system.indexOf('\n\n下面是刚才联网搜索'));
      chat.t0 = Date.now();
      var tEnd = 0;
      liveRead = voice.auto && voiceReady() ? Speaker.live(conv.id + ':' + conv.msgs.length, function (e) { toast('朗读失败：' + e.msg); }) : null;
      if (chat.open) renderSheet();
      return chatStream(rm.p, rm.id, system, hist, function (t, th) {
        if (t && !tEnd) { tEnd = Date.now(); if (th) chat.thinkMs = tEnd - chat.t0; }
        var firstThink = th && !chat.partialThink, firstText = t && !chat.partial;
        chat.partial = t; chat.partialThink = th;
        if (liveRead && t) liveRead.feed(t);
        var wasRecall = chat.phase === 'recall'; if (wasRecall) chat.phase = '';
        if ((firstThink || firstText || wasRecall) && chat.open) renderSheet();
        typerKick();
      }, useRecall ? {
        tools: RECALL_TOOLS,
        runTool: function (n, a) { return runRecallTool(n, a, conv.id); },
        onTool: function (log) { log.tpos = (chat.partialThink || '').length; (chat.recall = chat.recall || []).push(log); chat.phase = 'recall'; if (chat.open) renderSheet(); },
        onNoTools: function () { chat.recall = rclFb.hits.length ? [{ tool: 'auto', q: text, hits: rclFb.hits }] : null; },
        systemNoTools: systemNoTools
      } : null).then(function (res) {
        if (res.text && res.text.length > chat.partial.length) chat.partial = res.text;
        return typerFinish().then(function () { return res; });
      }).then(function (res) {
        var answer = (res.text || '').trim() || '（没有收到回复内容）';
        conv.msgs.push({ role: 'assistant', content: answer, reasoning: (res.think || '').trim(), thinkMs: res.think ? (tEnd || Date.now()) - chat.t0 : 0,
                         sources: chat.sources, recall: chat.recall, model: rm.id, ts: Date.now() });
        conv.model = rm.id; conv.pname = rm.p.name; conv.updated = Date.now(); saveChats();
        memMaybe(conv, text);
        if (liveRead) liveRead.done(res.text || '');
        chat.fresh = chat.partial ? 0 : 1;
        typerReset();
      });
    }).catch(function (e) {
      if (liveRead) liveRead.done(chat.partial || '');
      if (e && e.stopped) {
        if (chat.partial || chat.partialThink) {
          conv.msgs.push({ role: 'assistant', content: (chat.partial || '').trim() || '（已停止）', reasoning: (chat.partialThink || '').trim(), thinkMs: chat.thinkMs || (chat.partialThink ? Date.now() - chat.t0 : 0), sources: chat.sources, recall: chat.recall, model: rm.id });
          conv.model = rm.id; conv.pname = rm.p.name;
        }
        conv.updated = Date.now(); saveChats(); typerReset();
        return;
      }
      if (chat.partial) { conv.msgs.push({ role: 'assistant', content: chat.partial + '\n\n（回答中断了）', reasoning: chat.partialThink, sources: chat.sources, model: rm.id }); saveChats(); }
      chat.err = e.msg;
    }).then(function () {
      chat.busy = false; chat.partial = ''; chat.partialThink = ''; chat.phase = ''; chat.sources = null; chat.recall = null; chat.xhr = null; chat.stopped = false;
      if (chat.pop === 'proc' && chat.procKey === 'live') { var lc = curConv(); chat.procKey = lc && lc.msgs.length ? lc.id + ':' + (lc.msgs.length - 1) : ''; }
      if (ui.fixedKey) { saveProviders(); ui.fixedKey = false; }
      if (chat.open) renderSheet();
    });
  }

  // 每打开一层（标签页、设置子页、对话、聊天记录、弹出面板）就在历史里记一笔，
  // 安卓的返回手势会先退回网页历史，于是就一级一级往回退，退到首页再返回才离开 App
  function navDepth() {
    var d = 0;
    if (chat.open) {
      d += 1;
      if (chat.side) d += 1;
      if (chat.pop) d += 1;
      if (chat.pop && chat.popSub) d += 1;
    }
    var back = document.querySelector('#main .sub-head [data-ui^="back-"]');
    if (back) d += /^back-(providers|voice)$/.test(back.getAttribute('data-ui')) ? 2 : 1;
    if (state.tab !== 'today') d += 1;
    return d;
  }
  function navCloseTop() {
    if (chat.open) {
      if (chat.pop && chat.popSub) { chat.popAnim = 'back'; chat.popSub = ''; renderSheet(); return; }
      if (chat.pop) { closePop(); return; }
      if (chat.side) { setSide(false); return; }
      closeChat(); return;
    }
    var back = document.querySelector('#main .sub-head [data-ui^="back-"]');
    if (back) { back.click(); return; }
    if (state.tab !== 'today') { var t = document.querySelector('[data-tab="today"]'); if (t) t.click(); }
  }
  var navGoing = false;
  function navLevel() { return (history.state && history.state.nav) || 0; }
  function navSync() {
    if (navGoing) return;
    var D = navDepth(), s = navLevel();
    try {
      if (D > s) { for (var k = s + 1; k <= D; k++) history.pushState({ nav: k }, ''); }
      else if (D < s) { navGoing = true; history.go(D - s); setTimeout(function () { navGoing = false; }, 600); }
    } catch (e) { /* 没有历史记录功能时就用系统默认的返回 */ }
  }
  window.addEventListener('popstate', function () {
    navGoing = false;
    var s = navLevel();
    if (navDepth() > s) navCloseTop();
    setTimeout(navSync, 380);
  });
  document.addEventListener('click', function () { setTimeout(navSync, 0); setTimeout(navSync, 380); });
  setInterval(navSync, 700);

  if (Object.keys(DATA).length) dbState = 'ready';
  refreshAll(false);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshAll(false); });
})();
</script>
</body>
